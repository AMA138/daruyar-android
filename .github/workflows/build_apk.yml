name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q

      - name: Assets (HTML + icons)
        run: |
          pip install pillow
          python tools/make_icon.py
          python tools/build_assets.py

      - name: Build APK (javac + d8 + aapt + zipalign + apksigner)
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d $SDK/build-tools/* | sort -V | tail -1)"
          JAR="$(ls -d $SDK/platforms/android-* | sort -V | tail -1)/android.jar"
          mkdir -p build/classes
          javac -source 8 -target 8 -Xlint:-options -classpath "$JAR" -d build/classes android/src/ir/daruyar/app/MainActivity.java
          "$BT/d8" --lib "$JAR" --output build $(find build/classes -name '*.class')
          "$BT/aapt" package -f -M android/AndroidManifest.xml -S android/res -A android/assets -I "$JAR" -F build/unsigned.apk
          (cd build && "$BT/aapt" add unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/debug.jks -storepass daruyar123 -keypass daruyar123 \
            -alias daruyar -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Daruyar"
          "$BT/apksigner" sign --ks build/debug.jks --ks-pass pass:daruyar123 --key-pass pass:daruyar123 \
            --out Daruyar.apk build/aligned.apk
          "$BT/apksigner" verify Daruyar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Daruyar-apk
          path: Daruyar.apk
