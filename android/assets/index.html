<title>دارویار</title>
<style>

:root{--navy:#153A5B;--navy2:#19456A;--teal:#008975;--teal-d:#006f5e;--bg:#F0F4F8;--card:#fff;--ink:#12283C;--mute:#5B6E80;--line:#DCE4EC;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;
--shadow:0 6px 18px rgba(21,58,91,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.7}
body{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top svg{width:40px;height:40px;flex:none}
header.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:0}
header.top small{display:block;color:#9fd8cd;font-size:12px;margin-top:-4px}
.chip{margin-inline-start:auto;background:var(--navy2);border:1px solid #2c5f88;color:#fff;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
main{padding:14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
.bar{background:var(--navy);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.bar .lbl{color:#7fe0cc;font-size:12px}
.bar .txt{font-weight:700;font-size:14px;margin:4px 0 10px;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;min-height:44px}
.btn:active{background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.bar-b{background:#fff;color:var(--navy)}
.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #f0c4c4}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7fe0cc;outline-offset:2px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:90px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.tag{display:inline-block;background:#E4F4F1;color:#005f50;border-radius:8px;padding:1px 8px;font-size:12px;margin:2px 0 0 4px}
.med{display:flex;gap:10px;align-items:flex-start}
.med .t{flex:1}
.med b{font-size:15px}
.muted{color:var(--mute);font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;color:var(--mute);font-size:12px;cursor:pointer;border-top:3px solid transparent}
.tabs button.on{color:var(--teal);font-weight:800;border-top-color:var(--teal)}
.tabs .ic{display:block;font-size:20px;line-height:1.2}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--navy)}
.ring .n small{font-size:11px;color:var(--mute);font-weight:400}
.cat{margin:6px 0}.cat .k{display:flex;justify-content:space-between;font-size:13px}
.prog{height:8px;background:#E3EBF2;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--teal)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;background:#fff}
th{background:var(--navy);color:#fff;padding:8px;text-align:right;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
tr.s-taken td{background:#F2FBF5}tr.s-snoozed td{background:#FEFBE8}tr.s-skipped td{background:#FEF3F3}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.auth{background:var(--navy);min-height:100vh;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 28px;color:#fff;max-width:560px;margin:0 auto}
.auth .logo{text-align:center}.auth .logo svg{width:96px;height:96px}
.auth h1{text-align:center;margin:6px 0 0;font-size:26px}.auth p.s{text-align:center;color:#9fd8cd;margin:0 0 18px}
.auth .card{color:var(--ink)}
.seg{display:flex;background:#E8EEF4;border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;cursor:pointer;font-weight:700;color:var(--mute)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;padding:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.disc{font-size:12px;color:var(--mute);text-align:center;margin:14px 8px}
/* ---- v2: ظاهر مدرن‌تر ---- */
:root{--shadow:0 10px 30px rgba(21,58,91,.10);--r:22px}
html,body{background:#EEF3F8}
body{background:linear-gradient(180deg,#E3EEF5 0,#EEF3F8 260px);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
header.top{background:linear-gradient(135deg,#153A5B 0%,#0F5C7A 65%,#008975 100%);border-radius:0 0 28px 28px;padding-bottom:18px;box-shadow:0 10px 26px rgba(21,58,91,.28)}
header.top img{width:48px;height:48px;border-radius:15px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
header.top small{color:#CFF3EB}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(6px)}
main{padding:16px}
.card{border-radius:var(--r);border:1px solid #E4ECF3}
.card:has(.med){border-inline-start:5px solid var(--teal)}
.bar{background:linear-gradient(135deg,#153A5B 0%,#0E6B7C 60%,#008975 100%);border-radius:var(--r);position:relative;overflow:hidden;padding:18px}
.bar::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);top:-70px;left:-50px;pointer-events:none}
.bar .lbl{color:#B8F2E5}
.bar .txt{font-size:15px;line-height:1.9}
.btn{border-radius:14px;background:linear-gradient(135deg,#00A68C,#008975);box-shadow:0 4px 12px rgba(0,137,117,.28);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec,.btn.bad{box-shadow:none}
.btn.bar-b{background:rgba(255,255,255,.96);color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.pill{border-radius:22px;padding:7px 14px}
.pill.on{background:linear-gradient(135deg,#00A68C,#008975);box-shadow:0 3px 10px rgba(0,137,117,.3)}
.tag{background:#E1F5F0;color:#00604F;border-radius:10px;padding:2px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,137,117,.15);outline:0}
.tabs{left:12px;right:12px;max-width:536px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;gap:4px;border:1px solid #E1E9F0;border-radius:24px;box-shadow:0 12px 32px rgba(21,58,91,.20)}
.tabs button{border-radius:18px;border-top:0;padding:8px 4px}
.tabs button.on{background:#E1F5F0;border-top-color:transparent}
.toast{bottom:calc(108px + env(safe-area-inset-bottom,0px));border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.auth{background:linear-gradient(160deg,#153A5B 0%,#0F5C7A 70%,#008975 130%)}
.auth .logo img{width:108px;height:108px;border-radius:30px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.auth .card{border-radius:26px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.seg{border-radius:14px}.seg button.on{box-shadow:0 2px 8px rgba(0,0,0,.14)}
@media print{header.top,.tabs,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

function load() {
  const d = {user: null, token: null, meds: [], logs: [], server: "", guest: false, lastSync: null};
  try { return Object.assign(d, JSON.parse(localStorage.getItem("dy_state") || "{}")); } catch (e) { return d; }
}
function save() { try { localStorage.setItem("dy_state", JSON.stringify(st)); } catch (e) {} }
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function base() {

async function api(path, method = "GET", body) {
  const b = base(); if (b === null) throw Object.assign(new Error("آدرس سرور تنظیم نشده است"), {offline: true});
  const h = {"Content-Type": "application/json"}; if (st.token) h.Authorization = "Bearer " + st.token;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(b + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "خطای سرور"), {status: r.status});
    return j;
  } catch (e) { if (e.name === "AbortError" || e instanceof TypeError) e.offline = true; throw e; }
  finally { clearTimeout(t); }
}
async function sync(silent) {
  if (!st.token || base() === null) return;
  try {
    const j = await api("/api/sync", "POST", {meds: st.meds, logs: st.logs});
    st.meds = j.meds; st.logs = j.logs; st.user = j.user; st.lastSync = Date.now(); save();
    if (!silent) toast("همگام‌سازی با سرور انجام شد");
    render();
  } catch (e) {
    if (e.status === 401) { st.token = null; save(); render(); toast("نشست منقضی شد؛ دوباره وارد شوید"); }
    else if (!silent) toast("سرور در دسترس نیست؛ اطلاعات روی گوشی ذخیره می‌ماند");
  }
}
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(true), 600); }

/* ---------- زمان (به وقت تهران) ---------- */
function tehran(d = new Date()) {
  const p = (o) => new Intl.DateTimeFormat("en-u-ca-persian-nu-latn", Object.assign({timeZone: "Asia/Tehran"}, o)).formatToParts(d);
  const g = (parts, t) => (parts.find((x) => x.type === t) || {}).value;
  const dp = p({year: "numeric", month: "2-digit", day: "2-digit"});
  const tp = new Intl.DateTimeFormat("en-GB", {timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(d);
  const hh = +g(tp, "hour"), mm = +g(tp, "minute");
  return {
    date: `${g(dp, "year")}/${g(dp, "month")}/${g(dp, "day")}`,
    weekday: new Intl.DateTimeFormat("fa-IR", {timeZone: "Asia/Tehran", weekday: "long"}).format(d),
    hm: String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0"), min: hh * 60 + mm,
  };
}
function fmtRemain(m) {
  if (m <= 0) return "هم‌اکنون وقت مصرف دارو است!";
  const h = Math.floor(m / 60), r = m % 60;
  return h && r ? `${faNum(h)} ساعت و ${faNum(r)} دقیقه دیگر` : h ? `${faNum(h)} ساعت دیگر` : `${faNum(r)} دقیقه دیگر`;
}
function nextDue() {
  const now = tehran(); let best = null;
  for (const m of st.meds.filter((x) => !x.deleted)) {
    for (const t of String(m.times_csv).split(",").map((s) => s.trim()).filter(Boolean)) {
      const [h, mi] = t.split(":").map(Number); if (isNaN(h) || isNaN(mi)) continue;
      let diff = (h * 60 + mi - now.min + 1440) % 1440;
      if (snooze && snooze.id === m.client_id && snooze.until > Date.now()) diff = Math.ceil((snooze.until - Date.now()) / 60000);
      if (!best || diff < best.diff) best = {med: m, time: t, diff};
    }
  }
  return best;
}
function barText() {
  const now = tehran(), d = nextDue();
  if (!d) return {title: `📅 ${now.weekday} ${now.date}`, text: "هنوز دارویی ثبت نشده است"};
  return {
    title: `💊 داروی بعدی: ${d.med.name} (${d.med.dose})`,
    text: `📅 ${now.weekday} ${now.date}\n🍽 ${d.med.meal_relation || "—"}\n⏱ ${fmtRemain(d.diff)} (ساعت ${d.time})`,
  };
}
function notify() {
  const b = barText(), el = $("#barTxt");
  if (el) el.textContent = b.title + "\n" + b.text;
  try { if (window.AndroidBridge) window.AndroidBridge.updateNotification(b.title, b.text); } catch (e) {}
}

/* ---------- منطق دارو و گزارش ---------- */
const kind = (s) => /مصرف شد|مصرف کردم/.test(s) ? "taken" : /تعویق/.test(s) ? "snoozed" : "skipped";
function adherence(logs) { return logs.length ? Math.round(logs.filter((l) => kind(l.status) === "taken").length / logs.length * 1000) / 10 : 100; }
function byCategory() {
  const o = {};
  st.logs.forEach((l) => { const c = o[l.drug_category] || (o[l.drug_category] = {t: 0, k: 0}); c.t++; c.k += kind(l.status) === "taken"; });
  return o;
}
function addMed(m) {
  st.meds.unshift(Object.assign({client_id: uid(), deleted: 0, duration_days: 30, group: "", updated_at: Date.now()}, m));
  save(); notify(); scheduleSync();
}
function delMed(id) {
  const m = st.meds.find((x) => x.client_id === id); if (!m) return;
  m.deleted = 1; m.updated_at = Date.now(); save(); render(); scheduleSync();
}
function logDose(action, d) {
  d = d || nextDue(); if (!d) { toast("دارویی ثبت نشده است"); return; }
  const status = action === "taken" ? ST_TAKEN : action === "snooze" ? ST_SNOOZE : ST_SKIP;
  const now = tehran();
  st.logs.unshift({client_id: uid(), med_name: d.med.name, drug_category: d.med.drug_category, dose: d.med.dose,
    scheduled_time: d.time, actual_time: action === "skip" ? "—" : now.hm, weekday_name: now.weekday,
    persian_date: now.date, status, meal_relation: d.med.meal_relation || ""});
  if (action === "snooze") { snooze = {id: d.med.client_id, until: Date.now() + 600000}; toast("۱۰ دقیقه‌ی دیگر دوباره یادآوری می‌کنم"); }
  else { snooze = null; toast(action === "taken" ? "ثبت شد؛ در گزارش پزشک ذخیره گردید" : "ثبت شد که مصرف نشد"); }
  save(); render(); scheduleSync();
}
window.onNotifAction = (a) => { if (st.user || st.guest) logDose(a); };

function seedDemo() {
  const meds = [["متفورمین","کنترل قند خون (دیابت نوع ۲)","۵۰۰ میلی‌گرم","14:00,20:00","همراه با غذا","chronic"],
    ["لوزارتان","کنترل فشار خون","۲۵ میلی‌گرم","08:00,20:00","بدون شرط خاص / موضعی","chronic"],
    ["آتورواستاتین","کنترل چربی خون (کلسترول)","۲۰ میلی‌گرم","22:00","قبل از خواب شبانه","chronic"],
    ["کراتین مونوهیدرات","مکمل ورزشی (قدرت)","۵ گرم","17:00","بلافاصله بعد از ورزش (Post-Workout)","sport"]];
  if (!st.meds.some((m) => !m.deleted)) meds.forEach((m) => addMed({name: m[0], drug_category: m[1], dose: m[2], times_csv: m[3], meal_relation: m[4], group: m[5]}));
  for (let back = 6; back >= 0; back--) {
    const d = new Date(Date.now() - back * 86400000), t = tehran(d);
    meds.slice(0, 3).forEach((m, i) => {
      const roll = (back * 5 + i * 3 + Math.floor(back / 2)) % 9, status = roll === 7 ? ST_SKIP : (roll === 2 || roll === 4) ? ST_SNOOZE : ST_TAKEN;
      const first = m[3].split(",")[0];
      st.logs.push({client_id: "demo-" + back + "-" + i + "-" + uid(), med_name: m[0], drug_category: m[1], dose: m[2], scheduled_time: first,
        actual_time: status === ST_SKIP ? "—" : first, weekday_name: t.weekday, persian_date: t.date, status, meal_relation: m[4]});
    });
  }
  save(); render(); scheduleSync(); toast("داده‌ی نمونه‌ی ۷ روزه درج شد");
}

async function doAuth() {
  const u = $("#au").value.trim(), p = $("#ap").value, mode = ui.authMode;

  try {
    const body = {username: u, password: p};
    if (mode === "register") { body.profile = $("#apr").value; body.display_name = ($("#adn").value || u); }
    const j = await api(mode === "register" ? "/api/register" : "/api/login", "POST", body);
    st.token = j.token; st.user = j.user; st.guest = false; ui.err = "";
    if (mode === "register") ui.group = PROFILE_GROUP[j.user.profile];
    save(); render(); sync(true);

}

function pickDrug(name) {
  const d = DRUGS.find((x) => x.name_fa === name); if (!d) { ui.form.drug = ""; return; }
  const times = d.times.split(",").map((s) => s.trim());
  ui.form = {drug: name, dose: d.dose, meal: d.meal_relation, freq: times.length, times, days: d.duration_days}; render();
}
function setFreq(n) { ui.form.freq = n; ui.form.times = DEFAULT_TIMES[n].slice(); render(); }
function submitMed() {
  const f = ui.form, d = DRUGS.find((x) => x.name_fa === f.drug);
  if (!d) { toast("ابتدا دارو را از فهرست انتخاب کنید"); return; }
  if (!f.dose.trim()) { toast("دوز را وارد کنید"); return; }
  addMed({name: d.name_fa, drug_category: d.category, group: d.group, dose: f.dose.trim(), times_csv: f.times.join(","), meal_relation: f.meal, duration_days: f.days || 30});
  ui.form = null; ui.tab = "today"; render(); toast("دارو اضافه شد؛ نوار اعلان به‌روز شد");
}
async function parseRx() {
  const text = ($("#rx").value || "").trim(); if (!text) { toast("متن نسخه خالی است"); return; }
  try { ui.preview = (await api("/api/parse", "POST", {text})).meds; if (!ui.preview.length) toast("داروی قابل‌تشخیصی پیدا نشد"); render(); }
  catch (e) { toast(e.offline ? "برای استخراج به سرور نیاز است؛ آدرس سرور را تنظیم کنید" : e.message); }
}
function loadFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $("#rx").value = String(r.result).slice(0, 20000); }; r.readAsText(f, "utf-8");
}
function addPreview() { ui.preview.forEach((m) => addMed({name: m.name, drug_category: m.drug_category, group: m.group, dose: m.dose, times_csv: m.times_csv, meal_relation: m.meal_relation, duration_days: m.duration_days})); const n = ui.preview.length; ui.preview = []; ui.tab = "today"; render(); toast(n + " دارو اضافه شد"); }

  return `<div class="card"><h2>شاخص پایبندی به درمان (Adherence)</h2><div class="ringwrap">
   <div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="#E3EBF2" stroke-width="12"/><circle cx="64" cy="64" r="52" fill="none" stroke="#008975" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg><div class="n">${faNum(pct)}٪<small>پایبندی کل</small></div></div>
   <div style="flex:1">${Object.entries(cats).map(([k, v]) => { const p = Math.round(v.k / v.t * 100); return `<div class="cat"><div class="k"><span>${esc(k)}</span><b>${faNum(p)}٪</b></div><div class="prog"><i style="width:${p}%"></i></div></div>`; }).join("") || '<span class="muted">هنوز نوبتی ثبت نشده است.</span>'}</div></div></div>
  <div class="card"><h2>جدول مصرف دارو (MAR) برای پزشک معالج / مربی</h2>${st.logs.length ? `<div class="tw"><table><thead><tr><th>#</th><th>دارو و دوز</th><th>دسته</th><th>شرط مصرف</th><th>روز و تاریخ</th><th>مقرر</th><th>ثبت</th><th>وضعیت</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<span class="muted">رکوردی ثبت نشده است.</span>'}
  <button class="btn sec noprint" style="margin-top:10px" onclick="window.print()">🖨 چاپ گزارش</button></div>`;
}

/* ---------- پروفایل و تنظیمات ---------- */
function viewSheet() {
  const u = st.user || {};
  return `<div class="overlay" onclick="if(event.target===this){ui.sheet=false;render()}"><div class="sheet"><h2 style="margin-top:0">${esc(u.display_name || u.username)}</h2>
  <div class="muted">${esc(PROFILES[u.profile] || "")} ${st.token ? "• متصل به سرور" : "• حالت آفلاین"}${st.lastSync ? " • آخرین همگام‌سازی: " + esc(tehran(new Date(st.lastSync)).hm) : ""}</div>
  <label for="srv">آدرس سرور</label><input id="srv" dir="ltr" style="text-align:left" value="${esc(st.server)}" placeholder="خالی = همین سرور">
  <div class="row" style="margin-top:10px"><button class="btn" onclick="st.server=$('#srv').value.trim();save();testServer()">ذخیره و آزمایش اتصال</button><button class="btn sec" onclick="sync(false)">همگام‌سازی اکنون</button></div>
  <div class="row" style="margin-top:10px"><button class="btn sec" onclick="logout()">خروج</button>${st.token ? `<button class="btn bad" onclick="deleteMe()">حذف همه‌ی اطلاعات من</button>` : ""}</div>
  <p class="disc">دارویار فقط یادآور است و توصیه‌ی پزشکی نمی‌دهد. برای هر سؤال درباره‌ی دارو با پزشک یا داروساز صحبت کنید.</p></div></div>`;
}
async function testServer() { try { await api("/api/health"); toast("اتصال به سرور برقرار است ✅"); sync(true); } catch (e) { toast("اتصال برقرار نشد ❌"); } }
async function deleteMe() { if (!confirm("همه‌ی اطلاعات شما از سرور و گوشی حذف می‌شود. ادامه می‌دهید؟")) return; try { await api("/api/delete_me", "POST"); } catch (e) { toast("حذف از سرور ناموفق بود"); return; } logout(); }

/* ---------- رندر ---------- */
function render() {
  const root = $("#root");
  if (!st.user) { root.innerHTML = viewAuth(); return; }
  const tabs = [["today", "🏠", "امروز"], ["add", "➕", "ثبت دارو"], ["record", "📋", "پرونده"]];
  root.innerHTML = `<header class="top">${LOGO}<div><h1>دارویار</h1><small>دارو را به‌موقع، فراموشی را هیچ‌وقت</small></div>
   <button class="chip" onclick="ui.sheet=true;render()">👤 ${esc((st.user.display_name || st.user.username).slice(0, 12))}</button></header>
   <main>${ui.tab === "today" ? viewToday() : ui.tab === "add" ? viewAdd() : viewRecord()}<p class="disc">دارویار فقط یادآور است و توصیه‌ی پزشکی نمی‌دهد. برای هر سؤال درباره‌ی دارو با پزشک یا داروساز صحبت کنید.</p></main>
   <nav class="tabs">${tabs.map((t) => `<button class="${ui.tab === t[0] ? "on" : ""}" onclick="ui.tab='${t[0]}';window.scrollTo(0,0);render()"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("")}</nav>${ui.sheet ? viewSheet() : ""}`;
  notify();
}

try { if (!st.token && !st.guest) st.user = null; } catch (e) {}
render();
setInterval(notify, 30000);
setInterval(() => { if (st.token && !ui.sheet && ui.tab !== "add") sync(true); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { sync(true); notify(); } });
if (st.token) sync(true);
</script>
</body>
</html>
