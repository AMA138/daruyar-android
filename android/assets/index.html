<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#153A5B">
<title>دارویار</title>
<style>

:root{--navy:#153A5B;--navy2:#19456A;--teal:#008975;--teal-d:#006f5e;--bg:#F0F4F8;--card:#fff;--ink:#12283C;--mute:#5B6E80;--line:#DCE4EC;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;
--shadow:0 6px 18px rgba(21,58,91,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.7}
body{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top svg{width:40px;height:40px;flex:none}
header.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:0}
header.top small{display:block;color:#9fd8cd;font-size:12px;margin-top:-4px}
.chip{margin-inline-start:auto;background:var(--navy2);border:1px solid #2c5f88;color:#fff;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
main{padding:14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
.bar{background:var(--navy);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.bar .lbl{color:#7fe0cc;font-size:12px}
.bar .txt{font-weight:700;font-size:14px;margin:4px 0 10px;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;min-height:44px}
.btn:active{background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.bar-b{background:#fff;color:var(--navy)}
.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #f0c4c4}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7fe0cc;outline-offset:2px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:90px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.tag{display:inline-block;background:#E4F4F1;color:#005f50;border-radius:8px;padding:1px 8px;font-size:12px;margin:2px 0 0 4px}
.med{display:flex;gap:10px;align-items:flex-start}
.med .t{flex:1}
.med b{font-size:15px}
.muted{color:var(--mute);font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;color:var(--mute);font-size:12px;cursor:pointer;border-top:3px solid transparent}
.tabs button.on{color:var(--teal);font-weight:800;border-top-color:var(--teal)}
.tabs .ic{display:block;font-size:20px;line-height:1.2}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--navy)}
.ring .n small{font-size:11px;color:var(--mute);font-weight:400}
.cat{margin:6px 0}.cat .k{display:flex;justify-content:space-between;font-size:13px}
.prog{height:8px;background:#E3EBF2;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--teal)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;background:#fff}
th{background:var(--navy);color:#fff;padding:8px;text-align:right;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
tr.s-taken td{background:#F2FBF5}tr.s-snoozed td{background:#FEFBE8}tr.s-skipped td{background:#FEF3F3}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.auth{background:var(--navy);min-height:100vh;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 28px;color:#fff;max-width:560px;margin:0 auto}
.auth .logo{text-align:center}.auth .logo svg{width:96px;height:96px}
.auth h1{text-align:center;margin:6px 0 0;font-size:26px}.auth p.s{text-align:center;color:#9fd8cd;margin:0 0 18px}
.auth .card{color:var(--ink)}
.seg{display:flex;background:#E8EEF4;border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;cursor:pointer;font-weight:700;color:var(--mute)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;padding:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.disc{font-size:12px;color:var(--mute);text-align:center;margin:14px 8px}
/* ---- v2: ظاهر مدرن‌تر ---- */
:root{--shadow:0 10px 30px rgba(21,58,91,.10);--r:22px}
html,body{background:#EEF3F8}
body{background:linear-gradient(180deg,#E3EEF5 0,#EEF3F8 260px);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
header.top{background:linear-gradient(135deg,#153A5B 0%,#0F5C7A 65%,#008975 100%);border-radius:0 0 28px 28px;padding-bottom:18px;box-shadow:0 10px 26px rgba(21,58,91,.28)}
header.top img{width:48px;height:48px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
header.top small{color:#CFF3EB}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(6px)}
main{padding:16px}
.card{border-radius:var(--r);border:1px solid #E4ECF3}
.card:has(.med){border-inline-start:5px solid var(--teal)}
.bar{background:linear-gradient(135deg,#153A5B 0%,#0E6B7C 60%,#008975 100%);border-radius:var(--r);position:relative;overflow:hidden;padding:18px}
.bar::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);top:-70px;left:-50px;pointer-events:none}
.bar .lbl{color:#B8F2E5}
.bar .txt{font-size:15px;line-height:1.9}
.btn{border-radius:14px;background:linear-gradient(135deg,#00A68C,#008975);box-shadow:0 4px 12px rgba(0,137,117,.28);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec,.btn.bad{box-shadow:none}
.btn.bar-b{background:rgba(255,255,255,.96);color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.pill{border-radius:22px;padding:7px 14px}
.pill.on{background:linear-gradient(135deg,#00A68C,#008975);box-shadow:0 3px 10px rgba(0,137,117,.3)}
.tag{background:#E1F5F0;color:#00604F;border-radius:10px;padding:2px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,137,117,.15);outline:0}
.tabs{left:12px;right:12px;max-width:536px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;gap:4px;border:1px solid #E1E9F0;border-radius:24px;box-shadow:0 12px 32px rgba(21,58,91,.20)}
.tabs button{border-radius:18px;border-top:0;padding:8px 4px}
.tabs button.on{background:#E1F5F0;border-top-color:transparent}
.toast{bottom:calc(108px + env(safe-area-inset-bottom,0px));border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.auth{background:linear-gradient(160deg,#153A5B 0%,#0F5C7A 70%,#008975 130%)}
.auth .logo img{width:108px;height:108px;border-radius:50%;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.auth .card{border-radius:26px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.seg{border-radius:14px}.seg button.on{box-shadow:0 2px 8px rgba(0,0,0,.14)}
/* ---- v3: هیرو، آمار، کاشی‌ها، تنظیمات، شروع متحرک ---- */
.card:has(.med){border-inline-start:0}
.hero{text-align:center;padding:20px 14px 14px}
.hero .hl{font-size:12.5px;color:#BDEFE4;margin-bottom:6px}
.hero .hname{font-size:22px;font-weight:800;line-height:1.5}
.hero .hsub{font-size:13.5px;color:#D6E8F2;margin-top:2px}
.hero .hcount{font-size:46px;font-weight:800;letter-spacing:1px;line-height:1.25;margin-top:10px}
.hero .hlbl{font-size:12.5px;color:#BDEFE4}
.meter{height:10px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin:12px 4px 14px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#2FE0B5,#7BF2D6);border-radius:8px;transition:width 1.2s ease}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn.bar-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;min-height:64px;font-size:13px;border-radius:16px;width:100%}
.grid3 .btn b{font-size:21px;line-height:1.1}
.hello{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 12px}
.hello b{font-size:18px}.hello span{color:var(--mute);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border-radius:20px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.4}.stat span{font-size:11.5px;color:#475569}
.stat.s1{background:#DDF3F7}.stat.s2{background:#E6E3FA}.stat.s3{background:#DDF5E6}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.tile{border:2px solid transparent;border-radius:18px;background:var(--tc);padding:10px 2px;font-size:11px;font-weight:700;color:#1d3a55;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.35}
.tile span{font-size:22px}.tile.on{border-color:var(--teal);box-shadow:0 4px 12px rgba(0,137,117,.2)}
.card.med{align-items:center;gap:12px}
.mi{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:23px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.x{border:0;background:#FDECEC;border-radius:12px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;margin:8px 0;padding:11px 12px;background:#fff;border-radius:14px;color:var(--ink);font-size:14px}
.sw input{display:none}
.sw i{width:46px;height:26px;border-radius:14px;background:#CBD5E1;position:relative;flex:none;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--teal)}.sw input:checked+i::after{right:23px}
.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fields3 label{font-size:11.5px;min-height:34px}
.tabs button.mid{overflow:visible}
.tabs button.mid .ic{display:grid;place-items:center;width:56px;height:56px;margin:-32px auto 2px;border-radius:50%;background:linear-gradient(135deg,#00B398,#008975);color:#fff;font-size:30px;font-weight:400;box-shadow:0 8px 20px rgba(0,137,117,.45);border:4px solid #fff}
.tabs button.mid.on{background:transparent}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 38%,#0F5C7A 0,#153A5B 60%,#0E2A44 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.sp-logo{position:relative;width:132px;height:132px;display:grid;place-items:center;animation:spPop .9s cubic-bezier(.2,1.4,.4,1) both}
.sp-logo img{width:132px;height:132px;border-radius:50%;position:relative;z-index:2;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:spBell 1.5s ease-in-out .9s 2}
.rp{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(47,191,143,.7);animation:spWave 2.2s ease-out infinite}
.rp.r2{animation-delay:.7s}.rp.r3{animation-delay:1.4s}
.sp-name{font-size:32px;font-weight:800;color:#fff;opacity:0;animation:spUp .7s .5s both}
.sp-tag{min-height:26px;font-size:15px;color:#BFEFE4}
@keyframes spPop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spBell{0%,100%{transform:rotate(0)}12%{transform:rotate(14deg)}28%{transform:rotate(-12deg)}44%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}76%{transform:rotate(3deg)}}
@keyframes spWave{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.cfm{position:fixed;inset:0;z-index:120;background:rgba(10,25,40,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.cfmbox{background:#fff;border-radius:22px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.cfmbox h3{margin:0 0 8px}.cfmbox p{margin:0 0 16px;color:#475569;line-height:1.9}
.cfmbox .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cfmbox .btn{width:100%}
@media print{header.top,.tabs,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
/* ---------- آموزش درون‌برنامه ---------- */
.hbtns{margin-inline-start:auto;display:flex;gap:6px}.hbtns .chip{margin-inline-start:0}
.guide{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ghead{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:8px}
.ghead b{flex:1;font-size:16px}
.ghead button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);color:#fff;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;min-height:36px}
.gprog{height:4px;background:#DCE4EC}.gprog i{display:block;height:100%;background:var(--teal);transition:width .25s}
.gbody{flex:1;overflow:auto;padding:16px}
.gic{font-size:44px;line-height:1.1}
.gbody h2{margin:6px 0 4px;font-size:20px}
.gbody ol{padding-inline-start:22px;margin:8px 0}.gbody li{margin:7px 0}
.gtip,.gwarn{border-radius:12px;padding:10px 12px;margin:12px 0}
.gtip{background:#E4F4F1;border-inline-start:4px solid var(--teal)}
.gwarn{background:#FFF4E0;border-inline-start:4px solid var(--warn)}
.gfoot{display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.gdots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.gdots i{width:8px;height:8px;border-radius:50%;background:#C9D5E0}.gdots i.on{background:var(--teal);width:20px;border-radius:6px}
.glist button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:48px}
.glist button.on{border-color:var(--teal);background:#E4F4F1}
@media print{.guide{display:none!important}}
</style>
</head>

/* ---------- سرور ---------- */
function base() {
  if (st.server) return st.server.replace(/\/+$/, "");
  return location.protocol.startsWith("http") ? "" : null;
}
async function api(path, method = "GET", body) {
  const b = base(); if (b === null) throw Object.assign(new Error("آدرس سرور تنظیم نشده است"), {offline: true});
  const h = {"Content-Type": "application/json"}; if (st.token) h.Authorization = "Bearer " + st.token;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(b + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "خطای سرور"), {status: r.status});
    return j;
  } catch (e) { if (e.name === "AbortError" || e instanceof TypeError) e.offline = true; throw e; }
  finally { clearTimeout(t); }
}
async function sync(silent) {
  if (!st.token || base() === null) return;
  if (st.profileDirty && st.user) {
    try {
      const pj = await api("/api/profile", "POST", {display_name: st.user.display_name, profile: st.user.profile, lunch_time: st.user.lunch_time || "", dinner_time: st.user.dinner_time || "", wake_time: st.user.wake_time || ""});
      st.user = pj.user; st.profileDirty = false;
    } catch (e) { if (e.status === 400) st.profileDirty = false; }
  }
  try {
    const j = await api("/api/sync", "POST", {meds: st.meds, logs: st.logs});
    st.meds = j.meds; st.logs = j.logs; st.user = j.user; st.lastSync = Date.now(); save();
    if (!silent) toast("همگام‌سازی با سرور انجام شد");
    render();
  } catch (e) {
    if (e.status === 401) { st.token = null; save(); render(); toast("نشست منقضی شد؛ دوباره وارد شوید"); }
    else if (!silent) toast("سرور در دسترس نیست؛ اطلاعات روی گوشی ذخیره می‌ماند");
  }
}
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(true), 600); }

/* ---------- زمان (به وقت تهران) ---------- */
function tehran(d = new Date()) {
  const p = (o) => new Intl.DateTimeFormat("en-u-ca-persian-nu-latn", Object.assign({timeZone: "Asia/Tehran"}, o)).formatToParts(d);
  const g = (parts, t) => (parts.find((x) => x.type === t) || {}).value;
  const dp = p({year: "numeric", month: "2-digit", day: "2-digit"});
  const tp = new Intl.DateTimeFormat("en-GB", {timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(d);
  const hh = +g(tp, "hour"), mm = +g(tp, "minute");
  return {
    date: `${g(dp, "year")}/${g(dp, "month")}/${g(dp, "day")}`,
    weekday: new Intl.DateTimeFormat("fa-IR", {timeZone: "Asia/Tehran", weekday: "long"}).format(d),
    hm: String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0"), min: hh * 60 + mm,
  };
}
function fmtRemain(m) {
  if (m <= 0) return "هم‌اکنون وقت مصرف دارو است!";
  const h = Math.floor(m / 60), r = m % 60;
  return h && r ? `${faNum(h)} ساعت و ${faNum(r)} دقیقه دیگر` : h ? `${faNum(h)} ساعت دیگر` : `${faNum(r)} دقیقه دیگر`;
}
function nextDue() {
  const now = tehran(); let best = null;
  for (const m of st.meds.filter((x) => !x.deleted)) {
    for (const t of String(m.times_csv).split(",").map((s) => s.trim()).filter(Boolean)) {
      const [h, mi] = t.split(":").map(Number); if (isNaN(h) || isNaN(mi)) continue;
      let diff = (h * 60 + mi - now.min + 1440) % 1440;
      if (snooze && snooze.id === m.client_id && snooze.until > Date.now()) diff = Math.ceil((snooze.until - Date.now()) / 60000);
      if (!best || diff < best.diff) best = {med: m, time: t, diff};
    }
  }
  return best;
}
const timesOf = (m) => String(m.times_csv).split(",").map((x) => x.trim()).filter(Boolean);
function prevElapsed() {
  const now = tehran(); let best = null;
  for (const m of st.meds.filter((x) => !x.deleted)) for (const t of timesOf(m)) {
    const [h, mi] = t.split(":").map(Number); if (isNaN(h) || isNaN(mi)) continue;
    const e = (now.min - (h * 60 + mi) + 1440) % 1440; if (best === null || e < best) best = e;
  }
  return best;
}
function heroState() {
  const d = nextDue(); if (!d) return null;
  const el = prevElapsed(), total = Math.max(1, (el === null ? 1440 : el) + d.diff);
  const big = d.diff <= 0 ? "الان" : faNum(Math.floor(d.diff / 60)) + ":" + faNum(String(d.diff % 60).padStart(2, "0"));
  return {d, pct: Math.max(0, Math.min(100, Math.round(d.diff / total * 100))), big,
    lbl: d.diff <= 0 ? "وقت مصرف دارو است!" : "ساعت:دقیقه تا مصرف بعدی · ساعت " + faNum(d.time)};
}
function notify() {
  const h = heroState(); if (!h) return;
  const a = $("#hcount"), b = $("#hlbl"), c = $("#hmeter");
  if (a) a.textContent = h.big; if (b) b.textContent = h.lbl; if (c) c.style.width = h.pct + "%";
}
/* ---------- پل اندروید: برنامه‌ی دارو و تنظیمات برای زنگ و نوتیفیکیشن‌ها ---------- */
let pushT = null;
const gregKey = (d = new Date()) => new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Tehran"}).format(d).replace(/-/g, "");
function pushSchedule() {
  clearTimeout(pushT);
  pushT = setTimeout(() => {
    try {
      if (!window.AndroidBridge || !window.AndroidBridge.syncSchedule) return;
      const today = tehran().date, gk = gregKey(), on = !!(st.user || st.guest);
      const done = st.logs.filter((l) => l.persian_date === today && kind(l.status) !== "snoozed").map((l) => l.med_name + "|" + l.scheduled_time + "|" + gk);
      const meds = on ? st.meds.filter((m) => !m.deleted).map((m) => ({name: m.name, dose: m.dose, meal: m.meal_relation || "", times: timesOf(m)})) : [];
      window.AndroidBridge.syncSchedule(JSON.stringify({settings: st.settings, meds, done}));

}

function setSet(k, v) {

  if (R[k]) v = Math.max(R[k][0], Math.min(R[k][1], Math.round(+v || 0)));

}

/* ---------- منطق دارو و گزارش ---------- */
const kind = (s) => /مصرف شد|مصرف کردم/.test(s) ? "taken" : /تعویق/.test(s) ? "snoozed" : "skipped";
function adherence(logs) { return logs.length ? Math.round(logs.filter((l) => kind(l.status) === "taken").length / logs.length * 1000) / 10 : 100; }
function byCategory() {
  const o = {};
  st.logs.forEach((l) => { const c = o[l.drug_category] || (o[l.drug_category] = {t: 0, k: 0}); c.t++; c.k += kind(l.status) === "taken"; });

}
function addMed(m) {

function logDose(action, d) {

  const now = tehran();

    scheduled_time: d.time, actual_time: action === "skip" ? "—" : now.hm, weekday_name: now.weekday,
    persian_date: now.date, status, meal_relation: d.med.meal_relation || ""});
  if (action === "snooze") { snooze = {id: d.med.client_id, until: Date.now() + 600000}; toast("۱۰ دقیقه‌ی دیگر دوباره یادآوری می‌کنم"); }
  else { snooze = null; toast(action === "taken" ? "ثبت شد؛ در گزارش پزشک ذخیره گردید" : "ثبت شد که مصرف نشد"); }
  save(); render(); scheduleSync();
}

  return `<div class="card"><h2>ثبت دارو از فهرست</h2>
   <div class="chips" role="tablist">${Object.entries(GROUPS).map(([k, v]) => `<button class="pill ${k === g ? "on" : ""}" onclick="ui.group='${k}';ui.form=null;render()">${v}</button>`).join("")}</div>
   <label for="fd">نام دارو / مکمل</label><select id="fd" onchange="pickDrug(this.value)"><option value="">— انتخاب کنید —</option>${list.map((d) => `<option value="${esc(d.name_fa)}" ${f.drug === d.name_fa ? "selected" : ""}>${esc(d.name_fa)} (${esc(d.name_en)})</option>`).join("")}</select>
   <label for="fo">دوز</label><input id="fo" value="${esc(f.dose)}" oninput="ui.form.dose=this.value">
   <p class="muted" style="margin:4px 0 0">دوز و شرط پیش‌فرض فقط برای تسریع ثبت است؛ مقدار نهایی را طبق نسخه‌ی پزشک یا برچسب دارو وارد کنید.</p>

   <div class="row" style="margin-top:8px">${f.times.map((t, i) => `<input type="time" value="${esc(t)}" style="width:110px" aria-label="ساعت ${i + 1}" onfocus="ui.form.slot=${i}" onchange="ui.form.times[${i}]=this.value">`).join("")}</div>

  ${prev}

   <button class="btn" onclick="getLink()">دریافت کد اتصال</button></div>${link}`;
}
function mealHint() {
  const u = st.user || {};
  if (!u.wake_time && !u.lunch_time && !u.dinner_time) return `<p class="muted" style="margin:6px 0 0">می‌توانید در تب «پروفایل» ساعت تقریبی بیداری، ناهار و شام را ثبت کنید تا اینجا برای انتخاب ساعت پیشنهاد شود.</p>`;
  const b = (ic, t, v) => v ? `<button type="button" class="btn sec small" onclick="useMeal('${esc(v)}')">${ic} ${t} من (${faNum(v)})</button>` : "";
  return `<div class="row" style="margin-top:8px">${b("☀️", "بیداری", u.wake_time)}${b("🍽", "ناهار", u.lunch_time)}${b("🌙", "شام", u.dinner_time)}</div>
   <p class="muted" style="margin:4px 0 0">ابتدا کادر ساعت موردنظر را لمس کنید، سپس یکی از دکمه‌ها را بزنید. ساعت نهایی را طبق نسخه‌ی پزشک یا برچسب دارو تنظیم کنید.</p>`;
}
function useMeal(t) {
  const f = ui.form; if (!f) return;
  f.times[Math.min(f.slot || 0, f.times.length - 1)] = t; render();
}
function pickDrug(name) {
  const d = DRUGS.find((x) => x.name_fa === name); if (!d) { ui.form.drug = ""; return; }
  const times = d.times.split(",").map((s) => s.trim());
  ui.form = {drug: name, dose: d.dose, meal: d.meal_relation, freq: times.length, times, days: d.duration_days}; render();
}
function setFreq(n) { ui.form.freq = n; ui.form.times = DEFAULT_TIMES[n].slice(); render(); }
function submitMed() {
  const f = ui.form, d = DRUGS.find((x) => x.name_fa === f.drug);
  if (!d) { toast("ابتدا دارو را از فهرست انتخاب کنید"); return; }
  if (!f.dose.trim()) { toast("دوز را وارد کنید"); return; }
  addMed({name: d.name_fa, drug_category: d.category, group: d.group, dose: f.dose.trim(), times_csv: f.times.join(","), meal_relation: f.meal, duration_days: f.days || 30});
  ui.form = null; ui.tab = "today"; render(); toast("دارو اضافه شد؛ نوار اعلان به‌روز شد");
}
async function parseRx() {
  const text = ($("#rx").value || "").trim(); if (!text) { toast("متن نسخه خالی است"); return; }
  try { ui.preview = (await api("/api/parse", "POST", {text})).meds; if (!ui.preview.length) toast("داروی قابل‌تشخیصی پیدا نشد"); render(); }
  catch (e) { toast(e.offline ? "برای استخراج به سرور نیاز است؛ آدرس سرور را تنظیم کنید" : e.message); }
}
function loadFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $("#rx").value = String(r.result).slice(0, 20000); }; r.readAsText(f, "utf-8");
}
function addPreview() { ui.preview.forEach((m) => addMed({name: m.name, drug_category: m.drug_category, group: m.group, dose: m.dose, times_csv: m.times_csv, meal_relation: m.meal_relation, duration_days: m.duration_days})); const n = ui.preview.length; ui.preview = []; ui.tab = "today"; render(); toast(n + " دارو اضافه شد"); }
async function getLink() { try { ui.link = await api("/api/link_code", "POST"); render(); } catch (e) { toast(st.token ? "سرور در دسترس نیست" : "اتصال به بات فقط با حساب کاربری روی سرور ممکن است"); } }

/* ---------- تب ۳: پرونده‌ی بالینی ---------- */
function viewRecord() {
  const pct = adherence(st.logs), C = 2 * Math.PI * 52, cats = byCategory();
  const rows = st.logs.map((l, i) => `<tr class="s-${kind(l.status)}"><td>${faNum(i + 1)}</td><td><b>${esc(l.med_name)}</b><br><span class="muted">${esc(l.dose)}</span></td><td>${esc(l.drug_category)}</td><td>${esc(l.meal_relation || "—")}</td><td>${esc(l.weekday_name)}<br>${esc(l.persian_date)}</td><td>${esc(l.scheduled_time)}</td><td>${esc(l.actual_time)}</td><td>${esc(l.status)}</td></tr>`).join("");
  return `<div class="card"><h2>شاخص پایبندی به درمان (Adherence)</h2><div class="ringwrap">
   <div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="#E3EBF2" stroke-width="12"/><circle cx="64" cy="64" r="52" fill="none" stroke="#008975" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg><div class="n">${faNum(pct)}٪<small>پایبندی کل</small></div></div>
   <div style="flex:1">${Object.entries(cats).map(([k, v]) => { const p = Math.round(v.k / v.t * 100); return `<div class="cat"><div class="k"><span>${esc(k)}</span><b>${faNum(p)}٪</b></div><div class="prog"><i style="width:${p}%"></i></div></div>`; }).join("") || '<span class="muted">هنوز نوبتی ثبت نشده است.</span>'}</div></div></div>
  <div class="card"><h2>جدول مصرف دارو (MAR) برای پزشک معالج / مربی</h2>${st.logs.length ? `<div class="tw"><table><thead><tr><th>#</th><th>دارو و دوز</th><th>دسته</th><th>شرط مصرف</th><th>روز و تاریخ</th><th>مقرر</th><th>ثبت</th><th>وضعیت</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<span class="muted">رکوردی ثبت نشده است.</span>'}
  <button class="btn sec noprint" style="margin-top:10px" onclick="window.print()">🖨 چاپ گزارش</button></div>`;
}

  {ic: "🚀", t: "آماده‌اید! شروع سریع",

           "در تب «ثبت دارو» اولین داروی خود را اضافه کنید.",
           "اجازه‌ی نوتیفیکیشن را (در صورت پرسش) بدهید.",
           "هر بار موعد دارو رسید، یکی از سه دکمه (مصرف کردم / ۱۰ دقیقه بعد / نخوردم) را بزنید تا پرونده‌ی شما کامل شود."],
   tip: "دارویار فقط یادآور است و توصیه‌ی پزشکی نمی‌دهد. هر وقت خواستید، دکمه‌ی «❓ راهنما» بالای صفحه همین آموزش را دوباره باز می‌کند."},

function openGuide(i) { ui.tour = {i: i || 0, list: false}; render(); }
function closeTour() { ui.tour = null; if (!st.tourDone) { st.tourDone = true; save(); } render(); }
function guideGo(tab) { if (st.user) { ui.tab = tab; window.scrollTo(0, 0); } closeTour(); }
function guideStep(d) { ui.tour.i = Math.max(0, Math.min(TOUR.length - 1, ui.tour.i + d)); render(); }
function viewGuide() {
  const g = ui.tour, n = TOUR.length, s = TOUR[g.i], last = g.i === n - 1;
  const head = `<div class="ghead"><b>📖 آموزش دارویار</b><button onclick="ui.tour.list=!ui.tour.list;render()">${g.list ? "بازگشت" : "☰ فهرست"}</button><button onclick="closeTour()" aria-label="بستن آموزش">✕ بستن</button></div><div class="gprog"><i style="width:${Math.round((g.i + 1) / n * 100)}%"></i></div>`;
  const body = g.list
    ? `<div class="gbody glist"><p class="muted" style="margin-top:0">یکی از بخش‌ها را انتخاب کنید:</p>${TOUR.map((x, i) => `<button class="${i === g.i ? "on" : ""}" onclick="ui.tour.i=${i};ui.tour.list=false;render()"><span style="font-size:24px">${x.ic}</span><b>${faNum(i + 1)}. ${x.t}</b></button>`).join("")}</div>`
    : `<div class="gbody"><div class="gic">${s.ic}</div><h2>${s.t}</h2><p style="margin:0 0 6px">${s.intro}</p>
       ${s.steps ? `<ol>${s.steps.map((x) => `<li>${x}</li>`).join("")}</ol>` : ""}
       ${s.tip ? `<div class="gtip">💡 ${s.tip}</div>` : ""}${s.warn ? `<div class="gwarn">⚠️ ${s.warn}</div>` : ""}
       ${s.go ? `<button class="btn sec" onclick="guideGo('${s.go[0]}')">${s.go[1]}</button>` : ""}</div>`;
  const foot = `<div class="gfoot"><button class="btn sec" ${g.i === 0 ? "disabled" : ""} onclick="guideStep(-1)">▶ قبلی</button>
    <div class="gdots" aria-label="مرحله ${faNum(g.i + 1)} از ${faNum(n)}">${TOUR.map((x, i) => `<i class="${i === g.i ? "on" : ""}"></i>`).join("")}</div>
    <button class="btn" onclick="${last ? "closeTour()" : "guideStep(1)"}">${last ? "شروع کار ✓" : "بعدی ◀"}</button></div>`;
  return `<div class="guide" role="dialog" aria-label="آموزش دارویار">${head}${body}${foot}</div>`;
}

/* ---------- تب ۴: پروفایل ---------- */
function viewProfile() {
  const u = st.user || {};
  return `<div class="card"><h2>👤 پروفایل من</h2>
   <label for="pn">نام نمایشی</label><input id="pn" maxlength="40" value="${esc(u.display_name || "")}">
   <label for="pt">نوع پروفایل</label><select id="pt">${Object.entries(PROFILES).map(([k, v]) => `<option value="${k}" ${u.profile === k ? "selected" : ""}>${v}</option>`).join("")}</select>
   <div class="muted" style="margin-top:6px">${esc(u.username || "")} ${st.token ? "• متصل به سرور" : "• حالت آفلاین"}</div></div>
  <div class="card"><h2>⏰ ساعت‌های تقریبی روز</h2>
   <p class="muted" style="margin-top:0"><b>چرا ثبت می‌کنیم؟</b> بعضی داروها شرط مصرف مرتبط با غذا (مثل «همراه با غذا» یا «بعد از غذا») یا «ناشتا» دارند. با دانستن ساعت تقریبی بیداری، ناهار و شام شما، هنگام ثبت دارو می‌توانیم ساعت یادآور را به‌جای ساعت پیش‌فرض (مثلاً ۰۸:۰۰ یا ۲۰:۰۰)، نزدیک برنامه‌ی واقعی خودتان پیشنهاد کنیم. این ساعت‌ها فقط پیشنهاد هستند و همیشه می‌توانید تغییرشان دهید.</p>
   <div class="row"><div style="flex:1"><label for="pw">بیداری (حدودی)</label><input id="pw" type="time" value="${esc(u.wake_time || "")}"></div>
   <div style="flex:1"><label for="pl">ناهار (حدودی)</label><input id="pl" type="time" value="${esc(u.lunch_time || "")}"></div>
   <div style="flex:1"><label for="pd">شام (حدودی)</label><input id="pd" type="time" value="${esc(u.dinner_time || "")}"></div></div>
   <p class="muted">خالی‌گذاشتن هر کدام مجاز است. ${esc(MEAL_NOTE)}</p>
   <button class="btn" style="width:100%" onclick="saveProfile()">ذخیره‌ی پروفایل</button></div>
  <div class="card"><h2>📖 آموزش استفاده</h2><p class="muted" style="margin-top:0">آموزش قدم‌به‌قدم همه‌ی بخش‌های دارویار؛ هر وقت لازم شد دوباره ببینید.</p>
   <button class="btn sec" style="width:100%" onclick="openGuide(0)">دیدن آموزش</button></div>`;
}
async function saveProfile() {
  const f = {display_name: $("#pn").value.trim(), profile: $("#pt").value, wake_time: $("#pw").value || "", lunch_time: $("#pl").value || "", dinner_time: $("#pd").value || ""};
  if (!f.display_name) f.display_name = (st.user || {}).username || "";
  const typeChanged = f.profile !== (st.user || {}).profile;
  st.user = Object.assign({}, st.user, f);
  if (typeChanged) { ui.group = PROFILE_GROUP[f.profile]; ui.form = null; }
  if (st.token) {
    try { const j = await api("/api/profile", "POST", f); st.user = j.user; st.profileDirty = false; toast("پروفایل ذخیره شد"); }
    catch (e) {
      if (e.offline) { st.profileDirty = true; toast("روی گوشی ذخیره شد؛ بعداً با سرور همگام می‌شود"); }
      else if (e.status === 401) { st.token = null; toast("نشست منقضی شد؛ دوباره وارد شوید"); }
      else toast(e.message);
    }
  } else toast("پروفایل روی گوشی ذخیره شد");
  save(); render();
}

/* ---------- پروفایل و تنظیمات ---------- */
const sw = (k, t) => `<label class="sw"><span>${t}</span><input type="checkbox" ${st.settings[k] ? "checked" : ""} onchange="setSet('${k}',this.checked)"><i></i></label>`;
const numF = (k, t, a, b) => `<div><label>${t}</label><input type="number" inputmode="numeric" min="${a}" max="${b}" value="${st.settings[k]}" onchange="setSet('${k}',this.value)"></div>`;
function viewSettings() {
  return `<h3 style="margin:16px 0 4px">🔔 نوتیفیکیشن‌ها (نوار بالای گوشی)</h3>
  ${sw("notifDate", "📅 تاریخ امروز (شمسی، میلادی، قمری)")}${sw("notifMed", "💊 یادآور دارو با سه دکمه")}${sw("notifNext", "⏱ تایمر و نوار تا داروی بعدی")}
  <h3 style="margin:16px 0 4px">⏰ زنگ و تکرار</h3>
  ${sw("sound", "🔊 صدای زنگ")}${sw("vibrate", "📳 ویبره")}
  <div class="fields3">${numF("leadMin", "از چند دقیقه قبل", 0, 120)}${numF("repeatMin", "هر چند دقیقه", 1, 60)}${numF("repeatCount", "چند بار تکرار", 0, 10)}</div>
  <p class="muted" id="setHint">${hintText()}</p>`;
}
function viewSheet() {
  const u = st.user || {};
  return `<div class="overlay" onclick="if(event.target===this){ui.sheet=false;render()}"><div class="sheet"><h2 style="margin-top:0">${esc(u.display_name || u.username)}</h2>
  <div class="muted">${esc(PROFILES[u.profile] || "")} ${st.token ? "• متصل به سرور" : "• حالت آفلاین"}${st.lastSync ? " • آخرین همگام‌سازی: " + esc(tehran(new Date(st.lastSync)).hm) : ""}</div>
  ${viewSettings()}
  <label for="srv">آدرس سرور</label><input id="srv" dir="ltr" style="text-align:left" value="${esc(st.server)}" placeholder="خالی = همین سرور">
  <div class="row" style="margin-top:10px"><button class="btn" onclick="st.server=$('#srv').value.trim();save();testServer()">ذخیره و آزمایش اتصال</button><button class="btn sec" onclick="sync(false)">همگام‌سازی اکنون</button></div>
  <div class="row" style="margin-top:10px"><button class="btn sec" onclick="askLogout()">خروج</button>${st.token ? `<button class="btn bad" onclick="deleteMe()">حذف همه‌ی اطلاعات من</button>` : ""}</div>
  <p class="disc">دارویار فقط یادآور است و توصیه‌ی پزشکی نمی‌دهد. برای هر سؤال درباره‌ی دارو با پزشک یا داروساز صحبت کنید.</p></div></div>`;
}
async function testServer() { try { await api("/api/health"); toast("اتصال به سرور برقرار است ✅"); sync(true); } catch (e) { toast("اتصال برقرار نشد ❌"); } }
function deleteMe() { askConfirm("حذف همه‌ی اطلاعات", "همه‌ی اطلاعات شما از سرور و گوشی حذف می‌شود و قابل بازگرداندن نیست. ادامه می‌دهید؟", "بله، حذف شود", doDeleteMe); }
async function doDeleteMe() { try { await api("/api/delete_me", "POST"); } catch (e) { toast("حذف از سرور ناموفق بود"); return; } logout(); }

/* ---------- رندر ---------- */
function render() {
  const root = $("#root");
  if (!st.user) { root.innerHTML = viewAuth() + (ui.tour ? viewGuide() : ""); return; }
  if (!st.tourDone && !ui.tourShown) { ui.tourShown = true; ui.tour = {i: 0, list: false}; }
  const tabs = [["today", "🏠", "امروز"], ["add", "+", "ثبت دارو"], ["record", "📋", "پرونده"], ["profile", "👤", "پروفایل"]];
  root.innerHTML = `<header class="top">${LOGO}<div><h1>دارویار</h1><small>دارویار، یادآور داروی تو…</small></div>
   <div class="hbtns"><button class="chip" onclick="openGuide(0)" aria-label="راهنما">❓ راهنما</button><button class="chip" onclick="ui.sheet=true;render()" aria-label="تنظیمات">⚙️ تنظیمات</button></div></header>
   <main>${ui.tab === "today" ? viewToday() : ui.tab === "add" ? viewAdd() : ui.tab === "profile" ? viewProfile() : viewRecord()}<p class="disc">دارویار فقط یادآور است و توصیه‌ی پزشکی نمی‌دهد. برای هر سؤال درباره‌ی دارو با پزشک یا داروساز صحبت کنید.</p></main>
   <nav class="tabs">${tabs.map((t) => `<button class="${ui.tab === t[0] ? "on" : ""}${t[0] === "add" ? " mid" : ""}" onclick="ui.tab='${t[0]}';window.scrollTo(0,0);render()"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("")}</nav>${ui.sheet ? viewSheet() : ""}${ui.tour ? viewGuide() : ""}`;
  notify();
}

try { if (!st.token && !st.guest) st.user = null; } catch (e) {}
render();
setInterval(notify, 30000);
setInterval(() => { if (st.token && !ui.sheet && ui.tab !== "add") sync(true); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { sync(true); notify(); } });
if (st.token) sync(true);
setTimeout(() => { if (window.AndroidBridge) window.nativeResume(); else pushSchedule(); }, 700);
(function splash() {
  const el = document.getElementById("splash"); if (!el) return;
  el.querySelector(".sp-logo").insertAdjacentHTML("beforeend", LOGO);
  const txt = "دارویار، یادآور داروی تو…", tag = document.getElementById("spTag"); let i = 0;
  const tick = () => { tag.textContent = txt.slice(0, ++i); if (i < txt.length) setTimeout(tick, 75); };
  setTimeout(tick, 900);
  setTimeout(() => { el.classList.add("hide"); setTimeout(() => el.remove(), 700); }, 3400);
})();
</script>
</body>
</html>
