  const tp = new Intl.DateTimeFormat("en-GB", {timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(d);
  const hh = +g(tp, "hour"), mm = +g(tp, "minute");
  return {
    date: `${g(dp, "year")}/${g(dp, "month")}/${g(dp, "day")}`,
    weekday: new Intl.DateTimeFormat("fa-IR", {timeZone: "Asia/Tehran", weekday: "long"}).format(d),
    hm: String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0"), min: hh * 60 + mm,
  };
}
function fmtRemain(m) {
  if (m <= 0) return "هم‌اکنون وقت مصرف دارو است!";
  const h = Math.floor(m / 60), r = m % 60;
  return h && r ? `${faNum(h)} ساعت و ${faNum(r)} دقیقه دیگر` : h ? `${faNum(h)} ساعت دیگر` : `${faNum(r)} دقیقه دیگر`;
}
function nextDue() {
  const now = tehran(); let best = null;
  for (const m of st.meds.filter((x) => !x.deleted)) {
    for (const t of String(m.times_csv).split(",").map((s) => s.trim()).filter(Boolean)) {
      const [h, mi] = t.split(":").map(Number); if (isNaN(h) || isNaN(mi)) continue;
      let diff = (h * 60 + mi - now.min + 1440) % 1440;
      if (snooze && snooze.id === m.client_id && snooze.until > Date.now()) diff = Math.ceil((snooze.until - Date.now()) / 60000);
      if (!best || diff < best.diff) best = {med: m, time: t, diff};
    }
  }
  return best;
}
function barText() {
  const now = tehran(), d = nextDue();
  if (!d) return {title: `📅 ${now.weekday} ${now.date}`, text: "هنوز دارویی ثبت نشده است"};
  return {
    title: `💊 داروی بعدی: ${d.med.name} (${d.med.dose})`,
    text: `📅 ${now.weekday} ${now.date} | 🍽 ${d.med.meal_relation || "—"} | ⏱ ${fmtRemain(d.diff)} (ساعت ${d.time})`,
  };
}
function notify() {
  const b = barText(), el = $("#barTxt");
  if (el) el.textContent = b.title + "\n" + b.text;
  try { if (window.AndroidBridge) window.AndroidBridge.updateNotification(b.title, b.text); } catch (e) {}
}

/* ---------- منطق دارو و گزارش ---------- */
const kind = (s) => /مصرف شد|مصرف کردم/.test(s) ? "taken" : /تعویق/.test(s) ? "snoozed" : "skipped";
function adherence(logs) { return logs.length ? Math.round(logs.filter((l) => kind(l.status) === "taken").length / logs.length * 1000) / 10 : 100; }
function byCategory() {
  const o = {};
  st.logs.forEach((l) => { const c = o[l.drug_category] || (o[l.drug_category] = {t: 0, k: 0}); c.t++; c.k += kind(l.status) === "taken"; });
  return o;
}
function addMed(m) {
  st.meds.unshift(Object.assign({client_id: uid(), deleted: 0, duration_days: 30, group: "", updated_at: Date.now()}, m));
  save(); notify(); scheduleSync();
}
function delMed(id) {
  const m = st.meds.find((x) => x.client_id === id); if (!m) return;
  m.deleted = 1; m.updated_at = Date.now(); save(); render(); scheduleSync();
}
function logDose(action, d) {
  d = d || nextDue(); if (!d) { toast("دارویی ثبت نشده است"); return; }
  const status = action === "taken" ? ST_TAKEN : action === "snooze" ? ST_SNOOZE : ST_SKIP;
  const now = tehran();
  st.logs.unshift({client_id: uid(), med_name: d.med.name, drug_category: d.med.drug_category, dose: d.med.dose,
    scheduled_time: d.time, actual_time: action === "skip" ? "—" : now.hm, weekday_name: now.weekday,
    persian_date: now.date, status, meal_relation: d.med.meal_relation || ""});
  if (action === "snooze") { snooze = {id: d.med.client_id, until: Date.now() + 600000}; toast("۱۰ دقیقه‌ی دیگر دوباره یادآوری می‌کنم"); }
  else { snooze = null; toast(action === "taken" ? "ثبت شد؛ در گزارش پزشک ذخیره گردید" : "ثبت شد که مصرف نشد"); }
  save(); render(); scheduleSync();
}
window.onNotifAction = (a) => { if (st.user || st.guest) logDose(a); };

function seedDemo() {
  const meds = [["متفورمین","کنترل قند خون (دیابت نوع ۲)","۵۰۰ میلی‌گرم","14:00,20:00","همراه با غذا","chronic"],
    ["لوزارتان","کنترل فشار خون","۲۵ میلی‌گرم","08:00,20:00","بدون شرط خاص / موضعی","chronic"],
    ["آتورواستاتین","کنترل چربی خون (کلسترول)","۲۰ میلی‌گرم","22:00","قبل از خواب شبانه","chronic"],
    ["کراتین مونوهیدرات","مکمل ورزشی (قدرت)","۵ گرم","17:00","بلافاصله بعد از ورزش (Post-Workout)","sport"]];
  if (!st.meds.some((m) => !m.deleted)) meds.forEach((m) => addMed({name: m[0], drug_category: m[1], dose: m[2], times_csv: m[3], meal_relation: m[4], group: m[5]}));
  for (let back = 6; back >= 0; back--) {
    const d = new Date(Date.now() - back * 86400000), t = tehran(d);
    meds.slice(0, 3).forEach((m, i) => {
      const roll = (back * 5 + i * 3 + Math.floor(back / 2)) % 9, status = roll === 7 ? ST_SKIP : (roll === 2 || roll === 4) ? ST_SNOOZE : ST_TAKEN;
      const first = m[3].split(",")[0];
      st.logs.push({client_id: "demo-" + back + "-" + i + "-" + uid(), med_name: m[0], drug_category: m[1], dose: m[2], scheduled_time: first,
        actual_time: status === ST_SKIP ? "—" : first, weekday_name: t.weekday, persian_date: t.date, status, meal_relation: m[4]});
    });
  }
  save(); render(); scheduleSync(); toast("داده‌ی نمونه‌ی ۷ روزه درج شد");
}

  <label for="srv">آدرس سرور</label><input id="srv" dir="ltr" style="text-align:left" value="${esc(st.server)}" placeholder="خالی = همین سرور">
  <div class="row" style="margin-top:10px"><button class="btn" onclick="st.server=$('#srv').value.trim();save();testServer()">ذخیره و آزمایش اتصال</button><button class="btn sec" onclick="sync(false)">همگام‌سازی اکنون</button></div>
  <div class="row" style="margin-top:10px"><button class="btn sec" onclick="logout()">خروج</button>${st.token ? `<button class="btn bad" onclick="deleteMe()">حذف همه‌ی اطلاعات من</button>` : ""}</div>
  <p class="disc">دارویار فقط یادآور است و توصیه‌ی پزشکی نمی‌دهد. برای هر سؤال درباره‌ی دارو با پزشک یا داروساز صحبت کنید.</p></div></div>`;
}
async function testServer() { try { await api("/api/health"); toast("اتصال به سرور برقرار است ✅"); sync(true); } catch (e) { toast("اتصال برقرار نشد ❌"); } }
async function deleteMe() { if (!confirm("همه‌ی اطلاعات شما از سرور و گوشی حذف می‌شود. ادامه می‌دهید؟")) return; try { await api("/api/delete_me", "POST"); } catch (e) { toast("حذف از سرور ناموفق بود"); return; } logout(); }

/* ---------- رندر ---------- */
function render() {
  const root = $("#root");
  if (!st.user) { root.innerHTML = viewAuth(); return; }
  const tabs = [["today", "🏠", "امروز"], ["add", "➕", "ثبت دارو"], ["record", "📋", "پرونده"]];
  root.innerHTML = `<header class="top">${LOGO}<div><h1>دارویار</h1><small>دارو را به‌موقع، فراموشی را هیچ‌وقت</small></div>
   <button class="chip" onclick="ui.sheet=true;render()">👤 ${esc((st.user.display_name || st.user.username).slice(0, 12))}</button></header>
   <main>${ui.tab === "today" ? viewToday() : ui.tab === "add" ? viewAdd() : viewRecord()}<p class="disc">دارویار فقط یادآور است و توصیه‌ی پزشکی نمی‌دهد. برای هر سؤال درباره‌ی دارو با پزشک یا داروساز صحبت کنید.</p></main>
   <nav class="tabs">${tabs.map((t) => `<button class="${ui.tab === t[0] ? "on" : ""}" onclick="ui.tab='${t[0]}';window.scrollTo(0,0);render()"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("")}</nav>${ui.sheet ? viewSheet() : ""}`;
  notify();
}

try { if (!st.token && !st.guest) st.user = null; } catch (e) {}
render();
setInterval(notify, 30000);
setInterval(() => { if (st.token && !ui.sheet && ui.tab !== "add") sync(true); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { sync(true); notify(); } });
if (st.token) sync(true);
</script>
</body>
</html>
